services:
  redis:
    image: redis:7-alpine
    container_name: balicall-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: balicall-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    networks:
      - livekit

  egress:
    image: livekit/egress:v1.14.1
    container_name: balicall-egress
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        TARGET_UID=$${HOST_UID:-1003}
        if [ "$$(id -u egress 2>/dev/null)" -ne "$$TARGET_UID" ]; then
          usermod -u "$$TARGET_UID" egress 2>/dev/null || true
          chown -R egress /home/egress 2>/dev/null || true
        fi
        exec runuser -u egress -- /entrypoint.sh
    environment:
      TINI_SUBREAPER: "true"
      EGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: devkey
        api_secret: c35dce5eb68185c1ba3b140ab408da916a75c0d297f42c96cbbe5aa362f7b082
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - ./recordings:/out
    depends_on:
      - redis
      - livekit
    cap_add:
      - SYS_ADMIN
    networks:
      - livekit

networks:
  livekit:

volumes:
  redis_data:
